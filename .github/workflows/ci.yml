name: CI

on:
  pull_request:
  push:
    branches: [main, "rebuild/**"]

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
        env:
          LH_ENVIRONMENT: DEMO
